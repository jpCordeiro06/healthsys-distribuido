# Ambiente local para avaliar as imagens de produção. Use como Compose independente.
name: healthsys-prod
services:
  api-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api-gateway
      target: production
    init: true
    environment:
      HEALTHSYS_USER_SERVICE_URL: http://user-service:8081
      HEALTHSYS_PATIENT_SERVICE_URL: http://patient-service:8082
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_MESSAGE: never
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/api-gateway:production
    secrets:
    - source: jwt-public-key
      target: healthsys.security.jwt.public-key
    ports:
    - '8080:8080'
    depends_on:
      user-service:
        condition: service_started
      patient-service:
        condition: service_started
    mem_limit: 512m
  user-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.user-service
      target: production
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_MESSAGE: never
      RSA_PRIVATE_KEY: file:/run/secrets/jwt-private-key
      RSA_PUBLIC_KEY: file:/run/secrets/healthsys.security.jwt.public-key
      SPRING_JPA_SHOW_SQL: 'false'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/user-service:production
    secrets:
    - source: jwt-public-key
      target: healthsys.security.jwt.public-key
    - jwt-private-key
    mem_limit: 512m
  patient-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.patient-service
      target: production
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_MESSAGE: never
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/patient-service:production
    secrets:
    - source: jwt-public-key
      target: healthsys.security.jwt.public-key
    mem_limit: 512m
  medical-record-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.medical-record-service
      target: production
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_MESSAGE: never
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/medical-record-service:production
    secrets:
    - source: jwt-public-key
      target: healthsys.security.jwt.public-key
    mem_limit: 512m
  triage-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.triage-service
      target: production
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_MESSAGE: never
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/triage-service:production
    secrets:
    - source: jwt-public-key
      target: healthsys.security.jwt.public-key
    mem_limit: 512m
  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.notification-service
      target: production
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SERVER_ERROR_INCLUDE_STACKTRACE: never
      SERVER_ERROR_INCLUDE_MESSAGE: never
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60.0
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/notification-service:production
    secrets:
    - source: jwt-public-key
      target: healthsys.security.jwt.public-key
    mem_limit: 512m
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
      target: production
    networks:
    - healthsys-network
    restart: unless-stopped
    image: healthsys/frontend:production
    ports:
    - '3000:80'
    depends_on:
      api-gateway:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
    - healthsys-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    networks:
    - healthsys-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
    - mongodb_data:/data/db
  redis:
    image: redis:7-alpine
    networks:
    - healthsys-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
    - redis_data:/data
  kafka:
    image: apache/kafka:4.0.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
    - healthsys-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    volumes:
    - kafka_data:/var/lib/kafka/data
volumes:
  postgres_data: {}
  mongodb_data: {}
  redis_data: {}
  kafka_data: {}
networks:
  healthsys-network:
    driver: bridge
secrets:
  jwt-private-key:
    file: ${JWT_PRIVATE_KEY_FILE:-../secrets/private.pem}
  jwt-public-key:
    file: ${JWT_PUBLIC_KEY_FILE:-../secrets/public.pem}
