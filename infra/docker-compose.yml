services:
  api-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api-gateway
      target: development
    init: true
    volumes:
      - ..:/workspace:ro
      - api-gateway-gradle-cache:/home/gradle/.gradle
    container_name: healthsys-api-gateway
    environment:
      HEALTHSYS_USER_SERVICE_URL: http://user-service:8081
      HEALTHSYS_PATIENT_SERVICE_URL: http://patient-service:8082
    ports:
      - '8080:8080'
    networks:
      - healthsys-network

  user-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.user-service
      target: development
    init: true
    volumes:
      - ..:/workspace:ro
      - user-service-gradle-cache:/home/gradle/.gradle
    container_name: healthsys-user-service
    secrets:
      - source: jwt-public-key
        target: healthsys.security.jwt.public-key
    environment:
      RSA_PRIVATE_KEY: file:/workspace/secrets/private.pem
      RSA_PUBLIC_KEY: file:/run/secrets/healthsys.security.jwt.public-key
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthsys-network

  patient-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.patient-service
      target: development
    init: true
    volumes:
      - ..:/workspace:ro
      - patient-service-gradle-cache:/home/gradle/.gradle
    container_name: healthsys-patient-service
    secrets:
      - source: jwt-public-key
        target: healthsys.security.jwt.public-key
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '8082:8082'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - healthsys-network

  medical-record-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.medical-record-service
      target: development
    init: true
    volumes:
      - ..:/workspace:ro
      - medical-record-service-gradle-cache:/home/gradle/.gradle
    container_name: healthsys-medical-record-service
    secrets:
      - source: jwt-public-key
        target: healthsys.security.jwt.public-key
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    ports:
      - '8083:8083'
    networks:
      - healthsys-network

  triage-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.triage-service
      target: development
    init: true
    volumes:
      - ..:/workspace:ro
      - triage-service-gradle-cache:/home/gradle/.gradle
    container_name: healthsys-triage-service
    secrets:
      - source: jwt-public-key
        target: healthsys.security.jwt.public-key
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    ports:
      - '8084:8084'
    networks:
      - healthsys-network

  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.notification-service
      target: development
    init: true
    volumes:
      - ..:/workspace:ro
      - notification-service-gradle-cache:/home/gradle/.gradle
    container_name: healthsys-notification-service
    secrets:
      - source: jwt-public-key
        target: healthsys.security.jwt.public-key
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    ports:
      - '8085:8085'
    networks:
      - healthsys-network

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: healthsys-frontend
    ports:
      - '3000:80'
    networks:
      - healthsys-network

  postgres:
    image: postgres:16
    container_name: healthsys-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - healthsys-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: healthsys-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - healthsys-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthsys-redis
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - healthsys-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: healthsys-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - healthsys-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  api-gateway-gradle-cache:
  user-service-gradle-cache:
  patient-service-gradle-cache:
  medical-record-service-gradle-cache:
  triage-service-gradle-cache:
  notification-service-gradle-cache:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:

networks:
  healthsys-network:
    driver: bridge

secrets:
  jwt-public-key:
    file: ${JWT_PUBLIC_KEY_FILE:-../secrets/public.pem}
