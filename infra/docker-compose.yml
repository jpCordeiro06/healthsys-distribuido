services:
  api-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api-gateway
    container_name: healthsys-api-gateway
    ports:
      - '8080:8080'
    networks:
      - healthsys-network

  user-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.user-service
    container_name: healthsys-user-service
    ports:
      - '8081:8081'
    networks:
      - healthsys-network

  patient-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.patient-service
    container_name: healthsys-patient-service
    ports:
      - '8082:8082'
    networks:
      - healthsys-network

  medical-record-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.medical-record-service
    container_name: healthsys-medical-record-service
    ports:
      - '8083:8083'
    networks:
      - healthsys-network

  triage-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.triage-service
    container_name: healthsys-triage-service
    ports:
      - '8084:8084'
    networks:
      - healthsys-network

  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile.notification-service
    container_name: healthsys-notification-service
    ports:
      - '8085:8085'
    networks:
      - healthsys-network

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: healthsys-frontend
    ports:
      - '3000:80'
    networks:
      - healthsys-network

  postgres:
    image: postgres:16
    container_name: healthsys-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - healthsys-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: healthsys-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - healthsys-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: healthsys-redis
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - healthsys-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.1
    container_name: healthsys-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - healthsys-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:

networks:
  healthsys-network:
    driver: bridge
