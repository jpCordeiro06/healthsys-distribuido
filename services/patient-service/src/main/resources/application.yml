spring:
  application:
    name: patient-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:healthsys}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:healthsys}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:healthsys}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
    data:
      redis:
        host: localhost
        port: 6379

server:
  port: ${SERVER_PORT:8082}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

healthsys:
  security:
    jwt:
      public-key: ${HEALTHSYS_SECURITY_JWT_PUBLIC_KEY:}
