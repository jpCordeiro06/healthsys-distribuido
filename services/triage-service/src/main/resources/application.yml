spring:
  application:
    name: triage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:healthsys}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:healthsys}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:healthsys}}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8084}

grpc:
  patient-service:
    host: ${HEALTHSYS_PATIENT_GRPC_HOST:localhost}
    port: ${HEALTHSYS_PATIENT_GRPC_PORT:9082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

healthsys:
  security:
    jwt:
      public-key: ${HEALTHSYS_SECURITY_JWT_PUBLIC_KEY:}
