spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:healthsys}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:healthsys}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:healthsys}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

healthsys:
  security:
    jwt:
      public-key: ${HEALTHSYS_SECURITY_JWT_PUBLIC_KEY:}
    public-paths:
      - /api/v1/auth/login

rsa:
  private-key: ${RSA_PRIVATE_KEY:file:./secrets/private.pem}
  public-key: ${RSA_PUBLIC_KEY:file:./secrets/public.pem}
