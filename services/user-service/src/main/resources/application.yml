spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/usuarios_db
    username: postgres #a ser definido
    password: temppass #a ser definido
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

healthsys:
  security:
    jwt:
      public-key: ${HEALTHSYS_SECURITY_JWT_PUBLIC_KEY:}
    public-paths:
      - /api/v1/auth/login

rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem
